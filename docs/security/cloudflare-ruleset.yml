# vybz-cloud-custom-waf.yml
# Import: Cloudflare Dashboard → Security → WAF → Rulesets → Add ruleset → Import rules
# Target: VYBZ Vite SPA + Supabase Edge (staging first, then production)

meta:
  name: vybz-cloud-spa-edge
  description: Protect VYBZ SPA routes and Supabase Edge Functions
  schema_version: v1

rules:
  # ─────────────────────────────────────────────
  # 1. Allow healthy traffic
  # ─────────────────────────────────────────────
  - id: allow_spa_routes
    description: Allow SPA assets and HTML
    action: allow
    expression: |
      (http.request.method in {"GET" "HEAD"}) and
      (http.request.uri.path in {"/", "/enter"} or
       starts_with(http.request.uri.path, "/pack/") or
       starts_with(http.request.uri.path, "/assets/") or
       ends_with(http.request.uri.path, ".js") or
       ends_with(http.request.uri.path, ".css") or
       ends_with(http.request.uri.path, ".ico") or
       ends_with(http.request.uri.path, ".svg") or
       ends_with(http.request.uri.path, ".png") or
       ends_with(http.request.uri.path, ".webp"))

  - id: allow_edge_functions
    description: Allow Supabase Edge Functions
    action: allow
    expression: |
      starts_with(http.request.uri.path, "/functions/v1/")

  # ─────────────────────────────────────────────
  # 2. Block obvious LFI / traversal
  # ─────────────────────────────────────────────
  - id: block_lfi
    description: Block ../../etc/passwd and encoded traversal
    action: block
    # Free plan: use contains only (matches/regex needs Business / WAF Advanced)
    expression: |
      http.request.uri.path contains "../" or
      http.request.uri.query contains "../" or
      http.request.uri.path contains "%2e%2e" or
      http.request.uri.path contains "%252e%252e" or
      http.request.uri.query contains "%2e%2e" or
      http.request.uri.query contains "%252e%252e"

  # ─────────────────────────────────────────────
  # 3. Block prototype pollution probes
  # ─────────────────────────────────────────────
  - id: block_proto_pollution
    description: Block ?__proto__={} style payloads
    action: block
    expression: |
      http.request.uri.query contains "__proto__"

  # ─────────────────────────────────────────────
  # 4. Default: allow (falls through CF managed rules)
  # ─────────────────────────────────────────────
