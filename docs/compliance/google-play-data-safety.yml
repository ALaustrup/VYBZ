# Google Play Data Safety — VYBZ Android (cloud.vybz.app)

# Source of truth for Play Console Data safety form. Keep in sync with
# public/legal privacy docs. Phase 13 Android Beta.

app:
  application_id: cloud.vybz.app
  package_name: cloud.vybz.app
  form_version: "2026-07-30"
  track: beta

data_collection:
  # Collected and processed for account + product function
  - category: Personal info
    types:
      - name: Name
        collected: true
        shared: false
        required: true
        purpose: [App functionality, Account management]
      - name: Email address
        collected: true
        shared: false
        required: true
        purpose: [App functionality, Account management]
  - category: Financial info
    types:
      - name: Purchase history
        collected: true
        shared: false
        required: false
        purpose: [App functionality, Fraud prevention]
        notes: Stripe Checkout; no full card numbers stored by VYBZ
  - category: Photos and videos
    types:
      - name: Photos
        collected: true
        shared: false
        required: false
        purpose: [App functionality]
        notes: Artwork / cover uploads user-initiated
  - category: Audio files
    types:
      - name: Music files
        collected: true
        shared: false
        required: false
        purpose: [App functionality]
        notes: Masters / previews uploaded by the artist
  - category: App activity
    types:
      - name: App interactions
        collected: true
        shared: false
        required: false
        purpose: [Analytics, App functionality]
  - category: Device or other IDs
    types:
      - name: Device or other IDs
        collected: true
        shared: false
        required: false
        purpose: [App functionality, Developer communications]
        notes: FCM registration token for push (Phase 13)

data_sharing:
  - third_party: Supabase
    purpose: Auth, database, Storage
    data: [Account, uploaded media metadata]
  - third_party: Stripe
    purpose: Payments
    data: [Purchase tokens / Checkout session ids]
  - third_party: LiveKit
    purpose: Live streaming
    data: [Ephemeral room tokens]
  - third_party: Google Play
    purpose: Distribution / in-app updates
    data: [Install / update diagnostics]

security_practices:
  encryption_in_transit: true
  encryption_at_rest: true
  users_can_request_deletion: true
  committed_to_play_families: false
  independent_security_review: false

sensitive:
  location: false
  contacts: false
  sms: false
  call_log: false
  health: false
  sexual_orientation: false

ephemeral_processing_only: false
privacy_policy_url: https://vybz.cloud/legal/privacy
