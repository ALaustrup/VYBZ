# iOS CI — Phase 19 Alpha (signed IPA + TestFlight on phase19 tags)

name: ios

on:
  push:
    branches: [main, phase19-ios-alpha]
    tags: ["v1.1.0-beta1A-phase19*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-ipa:
    runs-on: macos-15
    env:
      IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
      IOS_CERT_PWD: ${{ secrets.IOS_CERT_PWD }}
      IOS_PROV_PROFILE_BASE64: ${{ secrets.IOS_PROV_PROFILE_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build web + Capacitor sync
        run: |
          npm run build:web
          npx cap sync ios

      - name: Import signing cert + provisioning profile
        if: env.IOS_CERT_BASE64 != '' && env.IOS_PROV_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/vybz.p12"
          PROFILE_PATH="$RUNNER_TEMP/vybz.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/vybz-ios.keychain-db"
          echo "$IOS_CERT_BASE64" | base64 -d > "$CERT_PATH"
          echo "$IOS_PROV_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          security create-keychain -p "${KEYCHAIN_PASSWORD:-vybz-ci}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD:-vybz-ci}" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "${IOS_CERT_PWD}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "Imported profile $PROFILE_UUID"

      - name: Archive + export IPA
        if: env.IOS_CERT_BASE64 != '' && env.IOS_PROV_PROFILE_BASE64 != ''
        working-directory: ios/App
        env:
          VYBZ_IOS_BUILD_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ../build
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath ../build/VYBZ.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"
          xcodebuild \
            -exportArchive \
            -archivePath ../build/VYBZ.xcarchive \
            -exportOptionsPlist ../ExportOptions.plist \
            -exportPath ../build

      - name: Unsigned archive smoke (no secrets)
        if: env.IOS_CERT_BASE64 == '' || env.IOS_PROV_PROFILE_BASE64 == ''
        run: |
          echo "IOS_CERT_* secrets empty — recording toolchain stub via smoke script"
          node scripts/smoke-ios-ipa.mjs

      - name: Record IOS_BUILDS.json
        if: env.IOS_CERT_BASE64 != '' && env.IOS_PROV_PROFILE_BASE64 != ''
        run: node scripts/smoke-ios-ipa.mjs
        env:
          VYBZ_IOS_BUILD_HASH: ${{ github.sha }}

      - name: Upload iOS artefacts
        uses: actions/upload-artifact@v4
        with:
          name: vybz-ios-ipa
          path: |
            ios/build/*.ipa
            ios/build/*.xcarchive
            ios/signing/IOS_BUILDS.json
          if-no-files-found: warn

      - name: TestFlight upload (phase19 tag)
        if: startsWith(github.ref, 'refs/tags/v1.1.0-beta1A-phase19') && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        working-directory: ios/fastlane
        run: |
          gem install fastlane --no-document
          fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

      - name: Draft GH release on phase19 tag
        if: startsWith(github.ref, 'refs/tags/v1.1.0-beta1A-phase19')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ios/build/*.ipa
            ios/signing/IOS_BUILDS.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
