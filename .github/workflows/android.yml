# Android CI — Phase 13 Beta (signed AAB + Play-ready artefact)

name: android

on:
  push:
    branches: [main, phase13-android-beta]
    tags: ["v1.1.0-beta1A-phase13*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-aab:
    runs-on: ubuntu-latest
    # Map secrets to env first — GitHub rejects `secrets.*` inside step `if:`.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_ALIAS_PWD: ${{ secrets.KEY_ALIAS_PWD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend deps
        run: npm ci

      - name: Build web + Capacitor sync
        run: |
          npm run build:web
          npx cap sync android

      - name: Import upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/vybz-upload.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PWD}
          keyPassword=${KEY_ALIAS_PWD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore/vybz-upload.jks
          EOF

      - name: Bundle release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
        env:
          VYBZ_ANDROID_BUILD_HASH: ${{ github.sha }}

      - name: Record ANDROID_BUNDLES.json
        run: node scripts/smoke-android-aab.mjs

      - name: Upload AAB artefact
        uses: actions/upload-artifact@v4
        with:
          name: vybz-android-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/signing/ANDROID_BUNDLES.json

      - name: Draft GH release on phase13 tag
        if: startsWith(github.ref, 'refs/tags/v1.1.0-beta1A-phase13')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/signing/ANDROID_BUNDLES.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
