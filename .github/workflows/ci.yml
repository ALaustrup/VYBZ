name: CI

# Type-check + build on every push and PR. This is the safety net: nothing
# reaches production without compiling cleanly first. No secrets needed.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build
