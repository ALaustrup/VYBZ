# Desktop CI — Phase 17 cross-platform (Windows MSI · macOS DMG · Linux AppImage)

name: desktop

on:
  push:
    branches: [main, phase12-desktop-beta, phase17-desktop-cross]
    tags: ["v1.1.0-beta1A-phase12*", "v1.1.0-beta1A-phase17*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-msi:
    runs-on: windows-latest
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PWD: ${{ secrets.WINDOWS_CERT_PWD }}
      UPDATE_BUCKET_WRITE_TOKEN: ${{ secrets.UPDATE_BUCKET_WRITE_TOKEN }}
      UPDATE_FEED_UPLOAD_URL: ${{ secrets.UPDATE_FEED_UPLOAD_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci

      - name: Install Tauri CLI
        run: npm i -D @tauri-apps/cli@^2.5.0 --no-save

      - name: Import Windows code-signing cert
        if: env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          $path = Join-Path $env:RUNNER_TEMP "vybz-codesign.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          echo "WINDOWS_CERT_FILE=$path" >> $env:GITHUB_ENV

      - name: Build MSI (+ NSIS)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $env:VYBZ_DESKTOP_BUILD_HASH = "${{ github.sha }}".Substring(0, 12)
          npx tauri build --bundles msi,nsis

      - name: Sign MSI with signtool (optional)
        if: env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          & signtool sign /f $env:WINDOWS_CERT_FILE /p $env:WINDOWS_CERT_PWD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $msi.FullName

      - name: Build update feed + DESKTOP_INSTALLERS.json
        run: node scripts/build-update-feed.mjs --fixtures

      - name: Upload feed (optional)
        if: env.UPDATE_BUCKET_WRITE_TOKEN != '' && env.UPDATE_FEED_UPLOAD_URL != ''
        run: node scripts/build-update-feed.mjs --upload

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vybz-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/updater/dist/**/*.json
            apps/desktop/signing/DESKTOP_INSTALLERS.json

  mac-dmg:
    runs-on: macos-latest
    env:
      MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
      MAC_CERT_PWD: ${{ secrets.MAC_CERT_PWD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      - name: Install Tauri CLI
        run: npm i -D @tauri-apps/cli@^2.5.0 --no-save

      - name: Import Apple Developer ID cert (notarisation)
        if: env.MAC_CERT_BASE64 != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERT_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-vybz-ci-keychain}"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 || true)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV
          echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> $GITHUB_ENV
          echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> $GITHUB_ENV
          echo "Certificate imported: ${CERT_ID:-unsigned}"

      - name: Build DMG (signed + notarised when secrets present)
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERT_PWD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export VYBZ_DESKTOP_BUILD_HASH="${GITHUB_SHA:0:12}"
          if [ -n "${{ secrets.MAC_CERT_BASE64 }}" ]; then
            echo "Building signed/notarised DMG (MAC_CERT_* present)"
          else
            echo "MAC_CERT_* missing — unsigned DMG for CI artifact smoke"
          fi
          npx tauri build --bundles dmg

      - name: Build update feed (darwin)
        run: node scripts/build-update-feed.mjs --fixtures

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vybz-desktop-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/updater/dist/darwin/stable.json
            apps/desktop/signing/DESKTOP_INSTALLERS.json

  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Linux bundler deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install frontend deps
        run: npm ci

      - name: Install Tauri CLI
        run: npm i -D @tauri-apps/cli@^2.5.0 --no-save

      - name: Build AppImage
        working-directory: apps/desktop
        run: |
          export VYBZ_DESKTOP_BUILD_HASH="${GITHUB_SHA:0:12}"
          npx tauri build --bundles appimage

      - name: Build update feed (linux)
        run: node scripts/build-update-feed.mjs --fixtures

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vybz-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/updater/dist/linux/stable.json
            apps/desktop/signing/DESKTOP_INSTALLERS.json

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v1.1.0-beta1A-phase17')
    needs: [windows-msi, mac-dmg, linux-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft GH release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/vybz-desktop-windows/**/*.msi
            artifacts/vybz-desktop-macos/**/*.dmg
            artifacts/vybz-desktop-linux/**/*.AppImage
            artifacts/**/stable.json
            artifacts/**/DESKTOP_INSTALLERS.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
