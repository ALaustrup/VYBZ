# Desktop Windows CI — Phase 12 Beta (signed MSI + update feed)

name: desktop

on:
  push:
    branches: [main, phase12-desktop-beta]
    tags: ["v1.1.0-beta1A-phase12*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci

      - name: Install Tauri CLI
        run: npm i -D @tauri-apps/cli@^2.5.0 --no-save

      - name: Import Windows code-signing cert
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          $path = Join-Path $env:RUNNER_TEMP "vybz-codesign.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          echo "WINDOWS_CERT_FILE=$path" >> $env:GITHUB_ENV
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}

      - name: Build MSI (+ NSIS)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $env:VYBZ_DESKTOP_BUILD_HASH = "${{ github.sha }}".Substring(0, 12)
          if ($env:WINDOWS_CERT_FILE) {
            $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content $env:WINDOWS_CERT_FILE -Raw
            # Authenticode via signtool when PFX present
            npx tauri build --bundles msi,nsis
          } else {
            Write-Host "WINDOWS_CERT_* missing — unsigned MSI for CI artifact smoke"
            npx tauri build --bundles msi,nsis
          }
        env:
          WINDOWS_CERT_PWD: ${{ secrets.WINDOWS_CERT_PWD }}

      - name: Sign MSI with signtool (optional)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          & signtool sign /f $env:WINDOWS_CERT_FILE /p $env:WINDOWS_CERT_PWD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $msi.FullName
        env:
          WINDOWS_CERT_PWD: ${{ secrets.WINDOWS_CERT_PWD }}

      - name: Build update feed + DESKTOP_INSTALLERS.json
        run: node scripts/build-update-feed.mjs

      - name: Upload feed (optional)
        if: ${{ secrets.UPDATE_BUCKET_WRITE_TOKEN != '' && secrets.UPDATE_FEED_UPLOAD_URL != '' }}
        run: node scripts/build-update-feed.mjs --upload
        env:
          UPDATE_BUCKET_WRITE_TOKEN: ${{ secrets.UPDATE_BUCKET_WRITE_TOKEN }}
          UPDATE_FEED_UPLOAD_URL: ${{ secrets.UPDATE_FEED_UPLOAD_URL }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vybz-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/updater/dist/stable.json
            apps/desktop/signing/DESKTOP_INSTALLERS.json

      - name: Draft GH release on phase12 tag
        if: startsWith(github.ref, 'refs/tags/v1.1.0-beta1A-phase12')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/updater/dist/stable.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
