[package]
name = "vybz-desktop"
version = "0.0.1"
description = "VYBZ Desktop Tauri shell (Phase 1.5 PoC)"
authors = ["Astra Matrix, Inc."]
edition = "2021"

[lib]
name = "vybz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
