[package]
name = "vybz-desktop"
version = "1.1.0"
description = "VYBZ Desktop Tauri shell (Windows alpha)"
authors = ["Astra Matrix, Inc."]
edition = "2021"

[lib]
name = "vybz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
