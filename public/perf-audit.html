<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VYBZ — Find Yours.</title>
    <meta name="description" content="Tip + live + catalog for indie artists." />
    <style>
      :root {
        color-scheme: dark;
        --abyss: #0a0e18;
        --snow: #f8fafc;
        --cyan: #00c2ff;
        --fog: #94a3b8;
        --glass: rgba(16, 28, 48, 0.55);
        --border: rgba(0, 194, 255, 0.22);
        --font: Lexend, "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font);
        background: radial-gradient(1200px 600px at 50% -10%, rgb(0 194 255 / 0.12), transparent), var(--abyss);
        color: var(--snow);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid rgb(255 255 255 / 0.08);
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 0.95rem;
      }
      main {
        flex: 1;
        display: grid;
        place-content: center;
        padding: 2rem 1.25rem 4rem;
        text-align: center;
        max-width: 40rem;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--fog);
        line-height: 1.55;
        font-size: 1.05rem;
      }
      a.cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border-radius: 0.625rem;
        background: var(--cyan);
        color: var(--abyss);
        font-weight: 600;
        text-decoration: none;
      }
      a.cta:focus-visible {
        outline: 2px solid var(--abyss);
        box-shadow: 0 0 0 4px rgb(0 194 255 / 0.55);
      }
      .panel {
        margin-top: 2rem;
        padding: 1rem 1.25rem;
        border-radius: 1rem;
        background: var(--glass);
        border: 1px solid var(--border);
        backdrop-filter: blur(12px);
        text-align: left;
        color: rgb(248 250 252 / 0.85);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">VYBZ</div>
      <span style="margin-left:auto;color:var(--fog);font-size:0.8rem">Find Yours.</span>
    </header>
    <main>
      <h1>Find Yours.</h1>
      <p>Tip + live + catalog for indie artists. Upload, play on VDock, tip with Vc, go live.</p>
      <a class="cta" href="/enter">Enter VYBZ</a>
      <div class="panel" role="note">
        Premium dark shell · glass depth · cyan accent. Phase 11 design-token gate page.
      </div>
    </main>
  </body>
</html>
