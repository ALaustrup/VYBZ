<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VYBZ Orders — Pending manual</title>
    <style>
      :root {
        color-scheme: dark;
        --abyss: #0a0e18;
        --snow: #f8fafc;
        --cyan: #00c2ff;
        --fog: #94a3b8;
        --amber: #fde68a;
        --glass: rgba(16, 28, 48, 0.55);
        --border: rgba(0, 194, 255, 0.22);
        --font: Lexend, ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font);
        background: var(--abyss);
        color: var(--snow);
        padding: 2rem 1.25rem;
      }
      h1 { font-size: 1.35rem; margin: 0 0 1rem; }
      table {
        width: 100%;
        max-width: 40rem;
        border-collapse: collapse;
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 1rem;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid rgb(255 255 255 / 0.06);
        font-size: 0.9rem;
      }
      th { color: var(--fog); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; }
      .pending { color: var(--amber); }
    </style>
  </head>
  <body>
    <main data-testid="storefront-orders-fixture">
      <h1>Orders</h1>
      <table data-testid="storefront-orders">
        <thead>
          <tr>
            <th>Buyer</th>
            <th>Amount</th>
            <th>Settlement</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>buyer@example.com</td>
            <td>$1.00</td>
            <td class="pending" data-testid="settlement-pending">Pending manual</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
